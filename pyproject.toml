[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent"
version = "0.1.0"
description = "通用个人 Agent（以 CowAgent 为蓝图的复现学习项目）"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",        # OpenAI 兼容接口，DeepSeek/Kimi 都走这个
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
